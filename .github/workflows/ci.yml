name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: pokedex
          POSTGRES_PASSWORD: pokedex
          POSTGRES_DB: pokedex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pokedex -d pokedex"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.1
          # Built with the runner's Go: prebuilt binaries lag behind the go.mod version.
          install-mode: goinstall
      - run: go test -race ./...
        env:
          APP_TEST_DATABASE_URL: postgres://pokedex:pokedex@localhost:5432/pokedex?sslmode=disable

  # Builds the real image and starts the whole stack the way a reviewer would,
  # then checks the app answers a search. Catches Dockerfile, compose and
  # migration problems that unit tests cannot.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build --wait
      - name: Readiness
        run: curl -fsS http://localhost:8080/readyz
      - name: A vocabulary-free search finds the sleep moves
        run: curl -fsS "http://localhost:8080/?q=put+opponent+to+sleep" | grep -q "Hypnosis"
      - name: Compare view
        run: curl -fsS "http://localhost:8080/compare?p=raichu&p=jolteon" | grep -q "Jolteon"
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down -v
