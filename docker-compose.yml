services:
  db:
    image: pgvector/pgvector:pg17
    container_name: pokedex-db
    environment:
      POSTGRES_USER: pokedex
      POSTGRES_PASSWORD: pokedex
      POSTGRES_DB: pokedex
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokedex -d pokedex"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    build: .
    container_name: pokedex-migrate-up
    command: ["-migrate", "up"]
    environment:
      APP_DATABASE_URL: postgres://pokedex:pokedex@db:5432/pokedex?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  import:
    build: .
    container_name: pokedex-import
    command: ["-import"]
    environment:
      APP_DATABASE_URL: postgres://pokedex:pokedex@db:5432/pokedex?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully

  app:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    container_name: pokedex-app
    environment:
      APP_DATABASE_URL: postgres://pokedex:pokedex@db:5432/pokedex?sslmode=disable
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      import:
        condition: service_completed_successfully
    restart: unless-stopped
    # The service only needs to listen and talk to the database.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
